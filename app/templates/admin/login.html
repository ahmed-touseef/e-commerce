<!doctype html>
<html lang="it">
<head>
{% include "admin/_head.html" %}
<title>Accedi · Eurofiora Admin</title>
</head>
<body>
<main class="signin">
  <div class="signin-box">
    <span class="wordmark">Eurofiora</span>
    <span class="label">Admin</span>
    <h1>Accedi</h1>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" novalidate>
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" value="{{ email }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Accedi</button>
    </form>
  </div>
</main>
</body>
</html>
